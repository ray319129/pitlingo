# 測試後端（2026-09-17）：只放語音辨識的測試端點。
#
# 使用者決定：測試端點不放正式後端（api.pitlingo.com）。
# 這個 Worker 跑 tools/build-backend.js 產生的完整版，但 PITLINGO_ROLE=asr-test 讓它
# 除了 /v1/asr/* 與 /v1/health 以外一律 404——它與正式後端共用同一個 KV，
# 不擋的話就是一個沒人看管的第二個正式 API。
#
# 部署：cd backend && npx wrangler deploy --config wrangler.test.toml
# 網址：https://f1zh-api-test.pitlingo.workers.dev
#
# 機密要**另外設**（Worker 之間不共用）：
#   npx wrangler secret put ASR_TEST_KEY       --config wrangler.test.toml
#   npx wrangler secret put DEEPGRAM_API_KEY   --config wrangler.test.toml
#   npx wrangler secret put ANTHROPIC_API_KEY  --config wrangler.test.toml   （整份翻譯用）
#   npx wrangler secret put TOKEN_SECRET       --config wrangler.test.toml   （頻率限制的雜湊金鑰，隨便一個長字串）
#
# ⚠️ 不可以加：[[routes]]／custom_domain、[triggers]（會重複同步賽程、多寄每日彙報）、Durable Object。
#    tools/build-backend.js --check 會擋。

name = "f1zh-api-test"
main = "dist/test/index.js"
compatibility_date = "2026-08-18"
workers_dev = true

[build]
command = "node ../tools/build-backend.js"

# 與正式後端共用：成本統計（熔斷）要算到語音辨識測試花的錢
[[kv_namespaces]]
binding = "SUBS"
id = "<你的 KV namespace id>"

[vars]
PITLINGO_ROLE = "asr-test"
DAILY_USD_CAP = "5"
ASR_DAILY_MINUTES = "120"

[observability]
enabled = true
