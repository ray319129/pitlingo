name = "f1zh-api"
# ⚠️ 部署的是**建置結果**，不是 src/parts/ 的原始碼（2026-09-17）。原始碼含有只給測試後端的語音辨識程式碼，
#    tools/build-backend.js 會把它們移除後寫到 dist/release/。下面的 [build] 讓 wrangler deploy 每次都先建置。
#    測試後端見 wrangler.test.toml。
main = "dist/release/index.js"

compatibility_date = "2026-08-18"

# 建立 KV：wrangler kv namespace create SUBS
# 然後把回傳的 id 填進來
# API 有自己的子網域。
#
# ⚠️ **不要把 pitlingo.com 掛在 Worker 上**——那會讓整個網域指向 API，
#    網站與法律文件全部變成 {"error":"not found"}。實際發生過。
#
#   pitlingo.com / www   → Cloudflare Pages（網站、法律文件、購買頁）
#   api.pitlingo.com     → 這個 Worker
#
# 用自訂網域而不是只靠 workers.dev，是為了日後換供應商時
# 不用改所有已安裝的擴充功能。
# ⚠️ 加了 [[routes]] 之後，wrangler 會**預設關掉 workers.dev 路由**。
#    實際踩過：加上子網域那一刻，f1zh-api.pitlingo.workers.dev 立刻回 1042，
#    而所有已安裝的擴充功能都指向那個位址——等於全部斷線。
#    這行必須留著，直到確認沒有任何用戶端還在用舊位址為止。
workers_dev = true

# 部署前自動建置（見 main 的說明）。⚠️ 必須放在所有頂層設定之後——TOML 裡表頭後面的鍵都屬於那個表
[build]
command = "node ../tools/build-backend.js"

[[routes]]
pattern = "api.pitlingo.com"
custom_domain = true

[[kv_namespaces]]
binding = "SUBS"
id = "<你的 KV namespace id>"

# 代訂自營的資料（v5.58，RESELL-OPS.md）。2026-10-12 建立，位置 APAC（客戶在台灣；
# 第一次建在 WNAM，空的時候刪掉重建——帳號頁每次查詢都要跨太平洋）。
# ⚠️ 沒綁的時候後端照常運作，代訂分頁顯示「資料庫還沒建立」，不會退回存 KV。
# ⚠️ 新增 migration：放進 backend/migrations/ 後 `wrangler d1 migrations apply pitlingo-resell --remote`，
#    **先套用、再部署**程式（反過來的話新程式查不到新欄位）。
[[d1_databases]]
binding = "RESELL_DB"
database_name = "pitlingo-resell"
database_id = "<你的 D1 database id>"
migrations_dir = "migrations"

# 機密不寫在這裡，用 wrangler secret put 設定：
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ADMIN_TOKEN      上傳與後台
#   wrangler secret put TOKEN_SECRET     簽發安裝權杖（未設定時由 ADMIN_TOKEN 衍生）
#   wrangler secret put CLIENT_TOKEN     舊版共用權杖，僅為相容 userscript
#
# 成本熔斷上限（美元／天）。不設定時預設 5。
# 這是 CLIENT_TOKEN 尚未淘汰前唯一的實質防線，務必設定。
[vars]
GOOGLE_CLIENT_ID = "<你的 Google OAuth client id>.apps.googleusercontent.com"
DAILY_USD_CAP = "5"
# KV 每日寫入的告警線（v5.86）。沒設＝免費方案的 1,000（撞到寫入就失敗）。
# ⚠️ 確認 Cloudflare 帳號已升級 Workers Paid 之後才打開：付費方案每月含 100 萬次寫入（≈ 每天 33,000），超過每百萬 $5。
# 沒升級就打開，真的撞牆時告警不會響。
KV_DAILY_PUTS = "33000"   # 2026-11-01 Ray 的 Cloudflare 主控台 Workers 方案頁顯示「付費：目前方案」
# 附贈比賽週的轉送（handoff 9.1 #19）。2026-10-11 Ray 同意開啟；條款「附贈比賽週通行證條款」第七條。
# ⚠️ 關掉時把條款第七條一起拿掉——check-legal 8 會驗兩邊一致。
GIFT_TRANSFER = "1"

# Cloudflare Turnstile（驗證碼登入的機器人驗證）。2026-10-11 Ray 同意啟用。
# widget「PitLingo 登入」（managed；網域 pitlingo.com／localhost／127.0.0.1）。site key 不是機密。
# 秘密：wrangler secret put TURNSTILE_SECRET——**沒設秘密時整個功能不啟用**（turnstileOk 直接放行）。
# ⚠️ HOSTNAMES 只放正式網域，**不可以放 localhost**（本機的 token 會在正式環境被接受）。
# ⚠️ 順序：先部署這兩個變數、最後才設秘密。反過來的話秘密一設後端就開始要求驗證，
#    前端卻還拿不到 site key——沒有人能用驗證碼登入。
TURNSTILE_SITE_KEY = "<你的 Turnstile site key>"
TURNSTILE_HOSTNAMES = "pitlingo.com"

# Google 一鍵登入的用戶端 ID。**不是機密**——它本來就會出現在前端原始碼裡。
# 到 Google Cloud Console → OAuth 同意畫面 → 建立「網頁應用程式」用戶端 ID，
# 授權來源填 https://pitlingo.com。**不需要** client secret（ID token 流程用不到）。
# ⚠️ 沒設定時帳號頁會顯示「尚未開放」，登入端點一律拒絕——**不是預設放行**。

# 後台的第二把鎖（TOTP，與 Google Authenticator／1Password 相容）。
#   wrangler secret put ADMIN_TOTP_SECRET      # base32，建議 32 字元以上
# ⚠️ 設了之後**光有 ADMIN_TOKEN 進不來**。權杖外流（貼進聊天、存進瀏覽器、
#    寫進筆記）時這是唯一還擋得住的東西。
# ⚠️ 設定前先把秘密加進手機的驗證器並確認算得出碼，**再**設進 Cloudflare——
#    順序反了會把自己鎖在外面，而那時你連去關掉它的後台都進不去。
#
# 後台的 IP 白名單（選用，逗號分隔）。設了就只有這些位址進得來。
# ⚠️ 家用網路的 IP 會變。**沒有固定 IP 就不要設這個**，改用上面的第二把鎖。
# ADMIN_IPS = "1.2.3.4,5.6.7.8"

# 診斷回報一律存進 KV，後台看得到——那層永遠可靠。
# 填了 REPORT_WEBHOOK 才會額外推一份出去（Email API／Discord／Slack 皆可）。
#
# ⚠️ 從 Cloudflare 寄信到 Gmail 需要**已驗證的寄件網域**（SPF/DKIM）。
#    在 pitlingo.com 設定好之前不要接——送達率會很差甚至直接進垃圾桶，
#    那比沒有更糟，因為你會以為沒人回報。
# REPORT_WEBHOOK = "https://..."
REPORT_TO = "you@example.com"
# 前導收割端不在的告警（直播中沒有前導端、場次開始 10 分鐘還沒出現）。Ray 2026-10-25 指定寄到自己的信箱
LEADER_ALERT_TO = "you@example.com"

# 每日彙報的收件人。沒設就用 REPORT_TO。
# ⚠️ **就算完全正常也會寄一封。** 只在有事時才寄的話，「系統壞了所以沒寄」
#    與「一切正常所以沒寄」長得一模一樣——而前者正是最需要你知道的情況。
# ⚠️ 一樣要等 Resend 的網域驗證完成才會真的送到；在那之前設 REPORT_WEBHOOK
#    （Discord／Slack）是唯一可靠的管道，兩條路是獨立的。
# DIGEST_TO = "you@example.com"

# 寄信（2026-11-03 起 sendMail()：Cloudflare → Resend → ZeptoMail，前一家失敗換下一家）。
# MAIL_FROM 的網域在每一家都要驗證（SPF/DKIM），否則會進垃圾桶。
#   主用：下面的 [[send_email]] binding（Cloudflare Email Sending，Workers Paid 每月含 3,000 封；
#         要先 `wrangler email sending enable pitlingo.com` 或在主控台啟用，否則每封都會退到備援）
#   備援：wrangler secret put RESEND_API_KEY
#   備援：wrangler secret put ZEPTOMAIL_TOKEN（Mail Agent 的 Send Mail Token，不含 Zoho-enczapikey 前綴）
#         ZEPTOMAIL_URL 選填，照 ZeptoMail 後台顯示的 API 網址（預設 https://api.zeptomail.com/v1.1/email）
# ⚠️ 三家都沒設時**不會報錯，只是不寄信**——付款完成頁仍看得到授權碼，
#    後台的訂單會標成「信未寄出」，可以用「補寄授權碼信」補。
MAIL_FROM = "PitLingo <noreply@pitlingo.com>"
SITE_URL = "https://pitlingo.com"
API_URL = "https://api.pitlingo.com"

# 金流回呼的驗簽。**沒設定任何一組時 webhook 會拒絕處理**——
# 寧可不發碼，也不要開一個誰都能 POST 一筆假訂單來領授權的窗口。
#   wrangler secret put ECPAY_HASH_KEY
#   wrangler secret put ECPAY_HASH_IV
# 或（自訂金流／測試用）
#   wrangler secret put WEBHOOK_SECRET

# ⚠️ 上線後**不要用 `wrangler deploy`**——那會 100% 立刻切換，出事沒有回頭路。
#    改用漸進式部署：
#      wrangler versions upload
#      wrangler versions deploy        # 指定版本與流量比例
#    回滾就是把比例調回 0，秒級生效。

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Durable Objects：直播的並發去重
#
# 每支影片一個實例，負責「誰去翻哪幾句」。Cache API 與 KV 都沒有 CAS，
# check-then-act 在同時抵達時完全失效（實測 10 個並發 → 10 次模型呼叫）；
# DO 是單執行緒，認領因此是原子操作。
#
# ⚠️ **第一次帶著 migration 部署時，必須用 `wrangler deploy`，不能用
#    `wrangler versions upload`。** Cloudflare 會直接拒絕：
#      code 10211 — migrations must be fully applied via a non-versioned deployment
#    原因是漸進式部署會讓新舊版本同時存在，而 DO migration 是全域一次性的狀態變更，
#    兩者在語意上衝突。migration 套用完之後，後續版本才能恢復用 versions upload。
#
# ⚠️ **migrations 是不可逆的。** class 一旦部署就不能隨便改名或刪除，
#    要改都必須再寫一次 migration。這是這個專案第一個
#    「部署錯了不能單純回滾」的東西，改動前先想清楚。
#
# 用 new_sqlite_classes 而不是 new_classes：SQLite 後端是目前建議的預設值，
# 而且我們只用它做協調，不存資料，兩者在這個用途上沒有差別。

# Cloudflare Email Sending（2026-11-03）。寄信的主力，見上面 MAIL_FROM 的說明。
[[send_email]]
name = "EMAIL"

# 速率限制（2026-10-26）：Cloudflare 的 Rate Limiting binding，取代每 25 個請求寫一次 KV 的取樣計數。
# limit 要等於 index.js 的 RATE_LIMIT_PER_MIN；period 只能 10 或 60（官方文件）。計數每個機房各一份、近似值。
# 官方文件沒寫免費方案能不能用；2026-10-26 實際部署免費方案接受（程式沒有 binding 時自動退回 KV 取樣）
[[ratelimits]]
name = "RL"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SubtitleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SubtitleRoom"]

# AuthGuard：登入的計數、單次使用與撤銷（2026-10-02）。
# ⚠️ 驗證碼以前存在 KV——最終一致、沒有 CAS，「5 次就燒掉」「用過就失效」在並發與
#    跨機房時都不成立。DO 同一時間只處理一個請求，所以這些判斷是原子的。
# ⚠️ 只有一個實例（auth-v1），儲存內容全部是雜湊。這一次部署帶 migration，必須用 wrangler deploy。
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthGuard"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthGuard"]

# 彈幕（2026-10-28，尚未發行；ops.danmaku.on 關著時只有白名單用得到）。
# ⚠️ 帶 migration 的這一次部署必須用 `wrangler deploy`，versions upload 會被 10211 拒絕
[[durable_objects.bindings]]
name = "DM"
class_name = "DanmakuRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DanmakuRoom"]

# 每天同步賽程。**賽事時間不能靠人工每週改**——比賽延期、改時間、加減場次
# 都會直接影響已售出通行證的效期（效期是依賽事資料動態算的）。
#
# ⚠️ 同步來源用 SCHEDULE_URL 指定；**沒設定時不做任何事**，使用內建賽程。
#    設定方式：wrangler secret put SCHEDULE_URL（或放進 [vars]，那不是機密）
# ⚠️ 抓到的資料會嚴格驗證，不合理就整份拒絕並保留原賽程。
#
# 同一支排程**在同步之後**接著產生並寄出每日彙報（成本、共用快取命中率、
# 本週還缺哪些場次沒收割、未處理工單、同步結果）。順序不能反——
# 彙報要報告同步結果，反過來報的永遠是昨天的。
# 同步失敗不會讓彙報跳過：那正是最需要通知你的一天。
[triggers]
# 第二條：每 5 分鐘巡查「場次開始了，前導收割端在不在」（leaderWatch）。⚠️ 字串要與 index.js LEADER_WATCH_CRON 一致
crons = ["0 4 * * *", "*/5 * * * *"]
